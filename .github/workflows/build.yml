name: Build LineageOS 23.2 - Infinix X6728

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_DIR: ${{ github.workspace }}/lineage

    steps:
      # Keep the runner's original single root filesystem. Do not create an LVM
      # build volume: the previous action filled / while allocating a second volume.
      - name: Free unused runner software on the single filesystem
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /var/lib/docker
          sudo apt-get clean
          mkdir -p "$BUILD_DIR/tmp/apt/lists" "$BUILD_DIR/tmp/apt/archives"
          echo "TMPDIR=$BUILD_DIR/tmp" >> "$GITHUB_ENV"
          echo "TMP=$BUILD_DIR/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$BUILD_DIR/tmp" >> "$GITHUB_ENV"
          echo "GIT_LFS_SKIP_SMUDGE=1" >> "$GITHUB_ENV"
          echo "=== Single filesystem after cleanup ==="
          df -hT /
          df -i /
          findmnt -T "$GITHUB_WORKSPACE"

      - name: Install only required build dependencies
        run: |
          sudo apt-get \
            -o Dir::State::lists="$BUILD_DIR/tmp/apt/lists" \
            -o Dir::Cache::archives="$BUILD_DIR/tmp/apt/archives" update
          sudo apt-get \
            -o Dir::State::lists="$BUILD_DIR/tmp/apt/lists" \
            -o Dir::Cache::archives="$BUILD_DIR/tmp/apt/archives" \
            install -y --no-install-recommends \
            git git-lfs curl wget repo \
            bc bison build-essential ccache \
            flex g++-multilib gcc-multilib \
            gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool \
            squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 \
            openjdk-21-jdk
          sudo apt-get clean
          sudo rm -rf "$BUILD_DIR/tmp/apt/lists/"*
          sudo rm -rf "$BUILD_DIR/tmp/apt/archives/"*
          git lfs install
          java -version
          repo version

      - name: Prepare build and temporary directories
        run: |
          mkdir -p "$BUILD_DIR/tmp"
          echo "TMPDIR=$BUILD_DIR/tmp" >> "$GITHUB_ENV"
          echo "TMP=$BUILD_DIR/tmp" >> "$GITHUB_ENV"
          echo "TEMP=$BUILD_DIR/tmp" >> "$GITHUB_ENV"
          echo "GIT_LFS_SKIP_SMUDGE=1" >> "$GITHUB_ENV"
          echo "=== Filesystems ==="
          df -hT / "$GITHUB_WORKSPACE" "$BUILD_DIR" /mnt /tmp
          df -i "$GITHUB_WORKSPACE" "$BUILD_DIR"
          findmnt -T "$BUILD_DIR"
          echo "=== Memory ==="
          free -h

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize LineageOS
        run: |
          cd "$BUILD_DIR"
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-23.2 \
            --depth=1 \
            --git-lfs

      - name: Create X6728 local manifest
        run: |
          cd "$BUILD_DIR"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/x6728.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="x6728github" fetch="https://github.com/" />
            <project name="Andrikurn/android_device_infinix_X6728"
                     path="device/infinix/X6728"
                     remote="x6728github"
                     revision="lineage-23.2" />
            <project name="Andrikurn/android_vendor_infinix_X6728"
                     path="vendor/infinix/X6728"
                     remote="x6728github"
                     revision="lineage-23.2" />
            <project name="Andrikurn/android_device_infinix_X6728-kernel"
                     path="device/infinix/X6728-kernel"
                     remote="x6728github"
                     revision="sixteen" />
            <project name="LineageOS/android_device_mediatek_sepolicy_vndr"
                     path="device/mediatek/sepolicy_vndr"
                     remote="x6728github"
                     revision="lineage-23.2" />
            <project name="LineageOS/android_hardware_mediatek"
                     path="hardware/mediatek"
                     remote="x6728github"
                     revision="lineage-23.2" />
            <project name="MillenniumOSS/android_vendor_mediatek_ims"
                     path="vendor/mediatek/ims"
                     remote="x6728github"
                     revision="sixteen-oem" />
          </manifest>
          EOF

      - name: Sync Android sources
        run: |
          cd "$BUILD_DIR"
          echo "=== Disk before repo sync ==="
          df -hT / "$BUILD_DIR" "$TMPDIR"
          df -i "$BUILD_DIR"
          repo sync -c --no-tags --no-clone-bundle --force-sync --optimized-fetch --prune -j2 --fail-fast
          echo "=== Disk after repo sync ==="
          df -hT / "$BUILD_DIR" "$TMPDIR"
          df -i "$BUILD_DIR"
          du -sh "$BUILD_DIR" "$BUILD_DIR/.repo" "$TMPDIR" 2>/dev/null || true

      - name: Pull and verify vendor LFS files
        run: |
          cd "$BUILD_DIR"
          git -C vendor/infinix/X6728 lfs pull
          git -C vendor/infinix/X6728 lfs fsck

      - name: Validate device tree and disk space
        run: |
          cd "$BUILD_DIR"
          test -f device/infinix/X6728/AndroidProducts.mk
          test -f device/infinix/X6728/lineage_X6728.mk
          test -f device/infinix/X6728/BoardConfig.mk
          test -f device/infinix/X6728/device.mk
          test -f device/infinix/X6728-kernel/dtb/mt6768.dtb
          test -f device/infinix/X6728-kernel/dtb/dtbo.img
          test -f vendor/infinix/X6728/X6728-vendor.mk
          test -f vendor/mediatek/ims/ims-vendor.mk
          df -hT / "$BUILD_DIR"
          du -sh "$BUILD_DIR" "$BUILD_DIR/.repo" 2>/dev/null || true

      - name: Build LineageOS
        run: |
          cd "$BUILD_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 8G
          source build/envsetup.sh
          lunch lineage_X6728-userdebug
          mka bacon -j2

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-23.2-X6728
          path: |
            ${{ github.workspace }}/lineage/out/target/product/X6728/*.zip
            ${{ github.workspace }}/lineage/out/target/product/X6728/*.img
          if-no-files-found: error
          retention-days: 7
