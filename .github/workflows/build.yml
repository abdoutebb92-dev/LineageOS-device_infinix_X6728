
name: Build LineageOS 23.2 - Infinix X6728

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ROM
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git git-lfs curl wget repo \
            bc bison build-essential ccache \
            flex g++-multilib gcc-multilib \
            gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses-dev \
            libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool \
            squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 \
            openjdk-21-jdk

          git lfs install
          java -version
          repo version

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize LineageOS
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-23.2 \
            --depth=1 \
            --git-lfs

      - name: Create X6728 local manifest
        run: |
          cd ~/android/lineage
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/x6728.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="x6728github" fetch="https://github.com/" />

            <project name="Andrikurn/android_device_infinix_X6728"
                     path="device/infinix/X6728"
                     remote="x6728github"
                     revision="lineage-23.2" />

            <project name="Andrikurn/android_vendor_infinix_X6728"
                     path="vendor/infinix/X6728"
                     remote="x6728github"
                     revision="lineage-23.2" />

            <project name="Andrikurn/android_device_infinix_X6728-kernel"
                     path="device/infinix/X6728-kernel"
                     remote="x6728github"
                     revision="sixteen" />

            <project name="LineageOS/android_device_mediatek_sepolicy_vndr"
                     path="device/mediatek/sepolicy_vndr"
                     remote="x6728github"
                     revision="lineage-23.2" />

            <project name="LineageOS/android_hardware_mediatek"
                     path="hardware/mediatek"
                     remote="x6728github"
                     revision="lineage-23.2" />

            <project name="MillenniumOSS/android_vendor_mediatek_ims"
                     path="vendor/mediatek/ims"
                     remote="x6728github"
                     revision="sixteen-oem" />
          </manifest>
          EOF

          cat .repo/local_manifests/x6728.xml

      - name: Sync Android sources
        run: |
          cd ~/android/lineage
          repo sync \
            -c \
            --no-tags \
            --no-clone-bundle \
            --force-sync \
            -j2 \
            --fail-fast

      - name: Pull vendor LFS files
        run: |
          cd ~/android/lineage
          git -C vendor/infinix/X6728 lfs pull || true

      - name: Validate device tree
        run: |
          cd ~/android/lineage

          test -d device/infinix/X6728
          test -d device/infinix/X6728-kernel
          test -d vendor/infinix/X6728

          echo "Device tree:"
          ls -la device/infinix/X6728

          echo "Kernel tree:"
          ls -la device/infinix/X6728-kernel

          echo "Vendor tree:"
          ls -la vendor/infinix/X6728

      - name: Build LineageOS
        run: |
          cd ~/android/lineage

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 20G

          source build/envsetup.sh
          lunch lineage_X6728-userdebug
          mka bacon -j2

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-23.2-X6728
          path: |
            ~/android/lineage/out/target/product/X6728/*.zip
            ~/android/lineage/out/target/product/X6728/*.img
          if-no-files-found: error
          retention-days: 7
